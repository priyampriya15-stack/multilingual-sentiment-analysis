services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indic_sentiment_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=false
      - DATABASE_URL=sqlite:///./sentiment.db
      - DEFAULT_MODEL=tfidf_baseline
      - DEVICE=cpu
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    volumes:
      - ./sentiment.db:/app/sentiment.db
      - ./ml/artifacts:/app/ml/artifacts
      - ./ml/data:/app/ml/data

  frontend:
    image: node:20-alpine
    container_name: indic_sentiment_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
